services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build: ./backend/FileMonitoring.Api
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Agent__EnrollmentToken: ${ENROLLMENT_TOKEN}
      Admin__Username: ${ADMIN_USERNAME}
      Admin__Password: ${ADMIN_PASSWORD}
      # Admin panel qaysi manzildan ochilsa ham ishlashi uchun "*". Cheklash: CORS_ORIGIN=http://192.168.1.31:5173
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-*}
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - ./aspnet-keys:/root/.aspnet/DataProtection-Keys
    ports: ["8080:8080"]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        # Bo'sh qoldirilsa panel API manzilini brauzer manzilidan oladi (http://<panel-host>:8080)
        VITE_API_URL: ${VITE_API_URL:-}
    depends_on: [api]
    ports: ["5173:80"]
    restart: unless-stopped
volumes:
  pgdata:
